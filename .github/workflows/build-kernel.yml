name: Build OP9 OOS14 Kernel (OnePlusOSS split trees)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex make git rsync ccache \
            libssl-dev libelf-dev dwarves \
            python3 python3-pip \
            clang lld llvm \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi g++-arm-linux-gnueabi

      - name: Clone kernel source (branch) and checkout commit
        run: |
          set -eux
          mkdir -p src
          cd src

          git clone --single-branch -b "oneplus/sm8350_u_14.0.0_oneplus9" \
          https://github.com/OnePlusOSS/android_kernel_oneplus_sm8350.git kernel

          cd kernel

          # جرّب checkout مباشرة (غالبًا ينجح لأن الكلون بدون depth)
          git checkout 9e38a9f || true

          # إذا فشل (مثلاً لأن الكلون كان shallow في مكان ما)، عمّق تاريخ نفس البرانش ثم أعد المحاولة
          if ! git rev-parse --verify 9e38a9f >/dev/null 2>&1; then
            git fetch --deepen=5000 origin "oneplus/sm8350_u_14.0.0_oneplus9"
            git checkout 9e38a9f
            fi


      - name: Clone modules/devicetree repo (same branch)
        run: |
          set -eux
          cd src
          git clone --single-branch -b "oneplus/sm8350_u_14.0.0_oneplus9" \
            https://github.com/OnePlusOSS/android_kernel_modules_and_devicetree_oneplus_sm8350.git modules

      - name: Merge missing trees (techpack + oplus kernel bits)
        run: |
          set -eux
          cd src/kernel

          # احذف أي placeholders/dirs تسبب submodule مشاكل أو تمنع النسخ
          rm -rf techpack/audio kernel/sched_assist kernel/uad kernel/special_opt kernel/tuning || true

          # 1) techpack (مؤكد وجوده في modules repo تحت msm-5.4)
          rsync -a ../modules/kernel/msm-5.4/techpack/ ./techpack/

          # 2) حاول تجيب إضافات oplus داخل kernel/ لو موجودة
          # (بعض الإصدارات تحطها هنا)
          if [ -d ../modules/kernel/msm-5.4/kernel ]; then
            rsync -a ../modules/kernel/msm-5.4/kernel/ ./kernel/
          fi

          # 3) fallback ذكي: دور على Kconfig المفقودة داخل modules repo وانسخها للمكان المتوقع
          pick_and_copy() {
            local want="$1"   # e.g. kernel/sched_assist/Kconfig
            local pat="$2"    # e.g. */sched_assist/Kconfig
            if [ -f "$want" ]; then return 0; fi
            local src
            src="$(find ../modules -type f -path "$pat" | head -n 1 || true)"
            if [ -n "$src" ]; then
              mkdir -p "$(dirname "$want")"
              rsync -a "$(dirname "$src")"/ "$(dirname "$want")"/
            else
              echo "WARN: $want not found in modules repo. Creating stub to pass Kconfig..."
              mkdir -p "$(dirname "$want")"
              printf 'menu "STUB (%s) - missing in public tree"\nendmenu\n' "$want" > "$want"
            fi
          }

          pick_and_copy "kernel/sched_assist/Kconfig" "*/sched_assist/Kconfig"
          pick_and_copy "kernel/uad/Kconfig"         "*/uad/Kconfig"
          pick_and_copy "kernel/special_opt/Kconfig" "*/special_opt/Kconfig"
          pick_and_copy "kernel/tuning/Kconfig"      "*/tuning/Kconfig"

          # sanity
          test -d techpack/audio
          test -f kernel/sched_assist/Kconfig

      - name: Install defconfig into kernel tree
        run: |
          set -eux
          cd src/kernel
          cp -f ../../configs/ossi_oos14_defconfig arch/arm64/configs/ossi_oos14_defconfig

      - name: Build (clang + lld)
        run: |
          set -eux
          cd src/kernel

          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          mkdir -p out
          make O=out ossi_oos14_defconfig
          make -j"$(nproc)" O=out CC=clang LD=ld.lld

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OP9-OOS14-kernel
          path: |
            src/kernel/out/arch/arm64/boot/Image
            src/kernel/out/arch/arm64/boot/Image.gz
            src/kernel/out/arch/arm64/boot/dts/**/*.dtb
            src/kernel/out/arch/arm64/boot/dtbo.img
